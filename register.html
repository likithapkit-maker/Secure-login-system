<!doctype html><html><head><title>Register</title></head><body>
<h2>Create Account</h2>{% with messages=get_flashed_messages() %}{% for m in messages %}<p>{{m}}</p>{% endfor %}{% endwith %}
<form method="post"><input name="username" placeholder="Username" required><br><br>
<input type="password" name="password" placeholder="Password (8+ characters)" required><br><br>
<button type="submit">Register</button></form><p><a href="/login">Back to login</a></p>
</body></html>
